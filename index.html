<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETS Christmas Countdown</title></head>
<body style="margin:0;background:#f4efe7;overflow:hidden">
<div id="ets-final-spark"><style>#ets-final-spark{box-sizing:border-box;width:100vw;height:100vh;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:#f4efe7;color:#403e39;font-family:Georgia,'Times New Roman',serif;text-align:center}#ets-final-spark:before,#ets-final-spark:after{content:'';position:absolute;top:0;bottom:0;width:12%;background:repeating-linear-gradient(90deg,#a5ae97 0,#a5ae97 13px,#f4efe7 13px,#f4efe7 27px)}#ets-final-spark:before{left:0}#ets-final-spark:after{right:0}.panel{position:absolute;left:9%;right:9%;top:7%;bottom:7%;background:#f8f3eb;border:1px solid rgba(128,112,92,.12);box-shadow:0 8px 35px rgba(76,65,53,.07)}.ribbon{position:absolute;z-index:4;left:9%;top:4%;width:220px;height:245px;pointer-events:none}.tail{position:absolute;left:46px;top:52px;width:13px;height:190px;background:#872a29;border-radius:60% 30% 50% 30%;transform:rotate(3deg)}.loop1,.loop2{position:absolute;top:12px;width:72px;height:39px;border:10px solid #872a29;border-radius:70% 45% 65% 42%}.loop1{left:12px;transform:rotate(13deg)}.loop2{left:74px;transform:scaleX(-1) rotate(16deg)}.knot{position:absolute;left:72px;top:33px;width:27px;height:23px;background:#772322;border-radius:50%}.sweep{position:absolute;left:93px;top:43px;width:105px;height:9px;background:#872a29;border-radius:100% 0 100% 0;transform:rotate(-7deg)}.content{position:relative;z-index:5;width:73%;display:flex;flex-direction:column;align-items:center}.ets{font-size:clamp(30px,3vw,48px);font-weight:700;letter-spacing:.30em;color:#b08d57;margin:0 0 .25vw .3em;text-transform:uppercase}.hero{font-family:'Segoe Script','Lucida Handwriting','Brush Script MT',cursive;font-size:clamp(61px,7.2vw,110px);font-weight:400;line-height:.91;color:#8d2b29;margin-bottom:.35vw}.flourish{width:88px;height:1px;margin:.1vw auto .75vw;background:linear-gradient(90deg,transparent,#b08d57 24%,#b08d57 76%,transparent);position:relative}.flourish:after{content:'✦';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:0 10px;background:#f8f3eb;color:#8d2b29;font-size:15px}.count{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:.8vw}.unit{padding:.9vw .25vw .68vw;border-left:1px solid rgba(157,139,106,.24)}.unit:first-child{border-left:0}.num{display:block;font-size:clamp(82px,8.5vw,132px);font-weight:600;line-height:.84;letter-spacing:-.045em;color:#3e3e39;font-variant-numeric:tabular-nums}.label{display:block;margin-top:14px;font-family:'Segoe UI',Arial,sans-serif;font-size:clamp(15px,1.3vw,21px);font-weight:650;letter-spacing:.23em;color:#8c795b;text-transform:uppercase}.message{margin-top:.9vw;font-family:'Segoe Script','Lucida Handwriting','Brush Script MT',cursive;font-size:clamp(22px,2vw,32px);color:#95504b}.message strong{color:#7f2425;font-weight:600}.spark{position:absolute;z-index:3;pointer-events:none;line-height:1;animation:twinkle 2.25s ease-in-out infinite alternate}.burg{color:#9b3435}.gold{color:#c1a164}.ivory{color:#fffdf7;text-shadow:0 0 6px #fff,0 0 13px rgba(255,255,255,.85)}.s1{left:15%;top:13%;font-size:14px}.s2{left:21%;top:27%;font-size:8px;animation-delay:.4s}.s3{left:17%;bottom:14%;font-size:15px;animation-delay:1s}.s4{left:27%;bottom:8%;font-size:9px;animation-delay:1.6s}.s5{right:16%;top:13%;font-size:15px;animation-delay:.7s}.s6{right:22%;top:28%;font-size:8px;animation-delay:1.3s}.s7{right:16%;bottom:15%;font-size:14px;animation-delay:.2s}.s8{right:28%;bottom:8%;font-size:9px;animation-delay:1.8s}.s9{left:35%;top:9%;font-size:10px;animation-delay:1.1s}.s10{left:47%;top:13%;font-size:7px;animation-delay:.5s}.s11{right:35%;top:8%;font-size:11px;animation-delay:1.5s}.s12{left:34%;bottom:9%;font-size:8px;animation-delay:2s}.s13{right:34%;bottom:10%;font-size:10px;animation-delay:.9s}.s14{left:44%;bottom:5%;font-size:6px;animation-delay:1.4s}.s15{right:45%;top:5%;font-size:7px;animation-delay:.3s}.s16{right:25%;top:51%;font-size:6px;animation-delay:1.9s}.s17{left:25%;top:53%;font-size:7px;animation-delay:.8s}@keyframes twinkle{0%{opacity:.08;transform:scale(.5) rotate(-6deg)}55%{opacity:.48}100%{opacity:.95;transform:scale(1.28) rotate(15deg)}}@media(max-width:650px){.content{width:82%}.hero{font-size:50px}.count{grid-template-columns:repeat(2,1fr)}.num{font-size:64px}}@media(prefers-reduced-motion:reduce){.spark{animation:none}}</style><div class="panel"></div><div class="ribbon"><i class="tail"></i><i class="loop1"></i><i class="loop2"></i><i class="knot"></i><i class="sweep"></i></div><div aria-hidden="true"><i class="spark burg s1">✦</i><i class="spark gold s2">✧</i><i class="spark ivory s3">✦</i><i class="spark burg s4">✧</i><i class="spark gold s5">✦</i><i class="spark burg s6">✧</i><i class="spark ivory s7">✦</i><i class="spark gold s8">✧</i><i class="spark burg s9">✦</i><i class="spark ivory s10">✧</i><i class="spark gold s11">✦</i><i class="spark burg s12">✧</i><i class="spark ivory s13">✦</i><i class="spark gold s14">✧</i><i class="spark burg s15">✦</i><i class="spark ivory s16">✧</i><i class="spark gold s17">✦</i></div><main class="content"><div class="ets">ETS</div><div class="hero">Christmas Countdown</div><div class="flourish"></div><div class="count" aria-live="polite"><div class="unit"><span class="num" id="efs-days">--</span><span class="label">Days</span></div><div class="unit"><span class="num" id="efs-hours">--</span><span class="label">Hours</span></div><div class="unit"><span class="num" id="efs-mins">--</span><span class="label">Minutes</span></div><div class="unit"><span class="num" id="efs-secs">--</span><span class="label">Seconds</span></div></div><div class="message">Nearly time to switch the <strong>out-of-office</strong> on…</div></main><script>(()=>{const root=document.getElementById('ets-final-spark');const el=id=>root.querySelector('#'+id);function target(){const n=new Date();let y=n.getFullYear();let t=new Date(y,11,25,0,0,0);if(n>=t)t=new Date(y+1,11,25,0,0,0);return t}let t=target();function tick(){const n=new Date();if(n>=t)t=target();let d=Math.max(0,t-n);const days=Math.floor(d/86400000);d%=86400000;const h=Math.floor(d/3600000);d%=3600000;const m=Math.floor(d/60000);d%=60000;const s=Math.floor(d/1000);el('efs-days').textContent=days;el('efs-hours').textContent=String(h).padStart(2,'0');el('efs-mins').textContent=String(m).padStart(2,'0');el('efs-secs').textContent=String(s).padStart(2,'0')}tick();setInterval(tick,1000)})();</script></div>
</body></html>
